apiVersion: 1
datasources:
  - name: Flight Warehouse
    uid: flight-warehouse
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: flight_warehouse
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
