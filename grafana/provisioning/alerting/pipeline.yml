apiVersion: 1
groups:
  - orgId: 1
    name: OpenSky health
    folder: OpenSky Observatory
    interval: 1m
    rules:
      - uid: opensky-poll-stale
        title: No successful source poll for 5 minutes
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: Source polling has stopped or publication failed. Inspect producer logs.
        labels:
          project: opensky
          severity: warning
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: flight-warehouse
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: "SELECT coalesce(extract(epoch FROM now()-max(recorded_at)), 999999)::double precision AS age_seconds FROM pipeline_metrics WHERE component='producer' AND source='live'"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [300]}
                  operator: {type: and}
                  reducer: {type: last, params: []}
                  type: query
