name: opensky

x-app: &app
  image: opensky-pipeline:local
  build:
    context: .
    dockerfile: app/Dockerfile
  restart: unless-stopped
  environment: &environment
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    PGHOST: postgres
    PGDATABASE: flight_warehouse
    PGUSER: pipeline
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-warehouse-password}
    SOURCE_MODE: ${SOURCE_MODE:-live}
    OPENSKY_COVERAGE: ${OPENSKY_COVERAGE:-global}
    BBOX_LAMIN: ${BBOX_LAMIN:-33}
    BBOX_LOMIN: ${BBOX_LOMIN:--7}
    BBOX_LAMAX: ${BBOX_LAMAX:-37}
    BBOX_LOMAX: ${BBOX_LOMAX:--2}
    DAILY_CREDIT_BUDGET: ${DAILY_CREDIT_BUDGET:-3600}
    RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-14}
    CURRENT_RETENTION_HOURS: ${CURRENT_RETENTION_HOURS:-24}
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 15
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/sh, -c]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flight-states --partitions 3 --replication-factor 1 --config retention.ms=172800000
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_DB: flight_warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-warehouse-password}
      GRAFANA_DB_PASSWORD: ${GRAFANA_PASSWORD:-local-dashboard-password}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres/02-reader.sh:/docker-entrypoint-initdb.d/02-reader.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pipeline -d flight_warehouse']
      interval: 5s
      timeout: 5s
      retries: 15
  producer:
    <<: *app
    command: [python, -m, app.producer]
    volumes:
      - ./.secrets:/run/secrets:ro
  consumer:
    <<: *app
    command: [python, -m, app.consumer]
  maintenance:
    <<: *app
    command: [python, -m, app.maintenance]
  dbt-runner:
    build:
      context: .
      dockerfile: dbt-runner/Dockerfile
    image: opensky-dbt:local
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-warehouse-password}
      DBT_INTERVAL_SECONDS: ${DBT_INTERVAL_SECONDS:-300}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-dashboard-password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flight-operations.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_PASSWORD:-local-dashboard-password}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
  tests:
    <<: *app
    profiles: [test]
    restart: 'no'
    command: [python, -m, pytest, -q, tests]
    environment:
      <<: *environment
      RUN_INTEGRATION: '1'

volumes:
  kafka-data:
  postgres-data:
  grafana-data:
